<header class="site-header">
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle Sidebar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  
  <div class="collapsed-brand">
    {{ .Site.Title }}
  </div>

  <div class="site-header-content" style="display: flex; flex-direction: column; height: 100%;">
    <a href="{{ .Site.BaseURL | relLangURL }}" class="brand-link" style="margin-bottom: 2rem; display: block;">
      <div class="brand-name" style="margin-bottom: 1.5rem;">{{ .Site.Title }}</div>
      <div class="sidebar-marquee-container">
        <div class="sidebar-marquee-content">
          <span>DATA SCIENTIST</span> <span style="margin: 0 1rem;">✖</span> <span>MACHINE LEARNING</span> <span style="margin: 0 1rem;">✖</span> <span>NEURAL NETWORKS</span> <span style="margin: 0 1rem;">✖</span>
          <span>DATA SCIENTIST</span> <span style="margin: 0 1rem;">✖</span> <span>MACHINE LEARNING</span> <span style="margin: 0 1rem;">✖</span> <span>NEURAL NETWORKS</span> <span style="margin: 0 1rem;">✖</span>
        </div>
      </div>
    </a>
    
    <nav class="site-nav">
      <ul class="nav-links">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL | relLangURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>

    <div style="margin-top: auto; padding-top: 2rem; border-top: var(--border-width) solid var(--border-color); display: flex; flex-direction: column; gap: 1.5rem;">
      {{ partial "lang-switch.html" . }}
      {{ partial "theme-toggle.html" . }}
    </div>
  </div>
</header>
