<aside class="sidebar">
  <div class="sidebar-top">
    <a href="{{ .Site.Home.RelPermalink }}" class="brand-link">
      <div class="brand-name">MATVEJ<br>MELIKHOV</div>
    </a>
    <div class="role-badge">{{ .Site.Params.subtitle }}</div>
    
    <nav class="sidebar-nav">
      <ul class="nav-links">
        {{ range .Site.Menus.main }}
          <li>
            <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>

  <div class="sidebar-bottom">
    <div class="controls-row">
      {{- partial "lang-switch.html" . -}}
      {{- partial "theme-toggle.html" . -}}
    </div>
  </div>
</aside>
