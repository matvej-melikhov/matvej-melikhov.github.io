<!DOCTYPE html>
<html lang="{{ .Language.Lang }}" {{ if eq (default "light" (index (split (default "light" "") "") 0)) "dark" }}class="dark"{{ end }}>
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  <div class="brutal-layout">
    {{- partial "header.html" . -}}
    
    <div class="content-wrapper">
      <main>
        {{- block "main" . }}{{ end -}}
      </main>
      {{- partial "footer.html" . -}}
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggle = document.getElementById('sidebar-toggle');
      if (toggle) {
        toggle.addEventListener('click', () => {
          document.documentElement.classList.toggle('collapsed-sidebar');
          localStorage.setItem('sidebar-collapsed', document.documentElement.classList.contains('collapsed-sidebar'));
        });
      }
    });
  </script>

  {{ $themeJS := resources.Get "js/theme-toggle.js" | minify | fingerprint }}
  <script src="{{ $themeJS.RelPermalink }}" defer></script>
  {{ $lightboxJS := resources.Get "js/lightbox.js" | minify | fingerprint }}
  <script src="{{ $lightboxJS.RelPermalink }}" defer></script>
</body>
</html>
